[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-wheat-pipeline"
version = "1.0.0"
description = "Reproducible UK wheat yield forecasting pipeline (thesis Results chapter)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "requests==2.32.5",
    "prophet==1.3.0",
    "xgboost==3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "jupytext==1.19.3",
    "nbconvert==7.16.6",
    "nbformat==5.10.4",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.setuptools]
packages = ["src"]
